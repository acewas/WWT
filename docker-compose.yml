version: '3.9'

services:
  django:
    build: .
    container_name: wwt-django
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Horwas@24}
      - POSTGRES_DB=${POSTGRES_DB:-wwt_db}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-replace_with_secret_key}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
    volumes:
      - .:/app
      - wwt_static_volume:/app/staticfiles
      - wwt_media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wwt_network

  postgres:
    image: postgres:16
    container_name: wwt-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Horwas@24}
      - POSTGRES_DB=${POSTGRES_DB:-wwt_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wwt_network

  pgadmin:
    image: dpage/pgadmin4:9.5
    container_name: wwt-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-horaceworwa@gmail.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-Horwas@24}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - wwt_network

volumes:
  wwt_static_volume:
  wwt_media_volume:
  postgres_data:

networks:
  wwt_network:
    driver: bridge

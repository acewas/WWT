services:
  django:
    build: .
    container_name: wwt-django
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - .:/app
      - wwt_static_volume:/app/staticfiles
      - wwt_media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wwt_network

  postgres:
    image: postgres:16
    container_name: wwt-postgres
    env_file: .env
    environment:
      - POSTGRES_USER=wwt_user
      - POSTGRES_PASSWORD=Horwas@24
      - POSTGRES_DB=wwt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wwt_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wwt_network

  pgadmin:
    image: dpage/pgadmin4:9.5
    container_name: wwt-pgadmin
    env_file: .env
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - wwt_network

volumes:
  wwt_static_volume:
  wwt_media_volume:
  postgres_data:

networks:
  wwt_network:
    driver: bridge
